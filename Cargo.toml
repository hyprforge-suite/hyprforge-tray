[package]
name = "hyprforge-tray"
version = "0.1.0"
edition = "2021"
license = "MIT"
# No longer "StatusNotifierItem/dbusmenu": this crate stopped serving
# com.canonical.dbusmenu (see src/lib.rs's own module doc for the cost
# that carries) in favour of `hyprforge-traymenu`, a sibling popup this
# crate's own `sni::ItemInterface::context_menu` spawns directly. Say so
# here too, or this description would be exactly the stale claim
# CLAUDE.md's rule about a comment describing behaviour that no longer
# exists warns against — just in a manifest instead of a doc comment.
description = "A StatusNotifierItem tray library, plus the hyprforge-trayd daemon that puts Wi-Fi, Bluetooth, keep-awake and night-light icons in whatever bar is running, drawing its own right-click menu through hyprforge-traymenu."
repository = "https://github.com/adamrpostjr/hyprforge"
documentation = "https://docs.rs/hyprforge-tray"
readme = "README.md"
keywords = ["hyprland", "tray", "statusnotifier", "linux"]
categories = ["os::linux-apis", "gui"]

# The library is the StatusNotifierItem protocol and nothing else — it
# knows nothing about Wi-Fi or Bluetooth, the same way hyprforge-ui knows
# nothing about Hyprland. The binary below is what joins it to them.
[[bin]]
name = "hyprforge-trayd"
path = "src/bin/trayd.rs"

[dependencies]
# A tray icon is a D-Bus object, not a toolkit widget. That is the whole
# reason this is possible at all: the suite forbids GTK and Qt, and every
# other way to put an icon in a bar drags one of them in.
#
# Run zbus on tokio rather than its default async-io executor. Without
# this zbus polls connections on its own thread, so D-Bus method handlers
# execute outside any tokio runtime and anything they spawn panics with
# "there is no reactor running".
zbus = { version = "5.18", default-features = false, features = ["tokio"] }
# "process" for spawning `hyprforge-settings --screen <name>` on a click,
# never waited on — see the comment on `handle_clicks` in trayd.rs. The
# rest (rt-multi-thread, macros, sync, time) is the workspace base this
# crate builds on everywhere else.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# The wire format `launch.rs` hands `hyprforge-traymenu` on its stdin —
# see that module's own doc.
serde_json = "1"
toml = "1.1"
anyhow = "1"

# Named as git dependencies, not versions, because the owner has not
# published to crates.io yet: this manifest has to work unchanged both
# inside the Hyprforge workspace and as the root of its own standalone
# repository once `git subtree split` pulls it out. Inside the
# workspace, the root Cargo.toml's `[patch]` section redirects these
# straight back to the local `crates/` directories, so nothing here
# touches the network; standalone, cargo fetches them from git.
#
# Where the preference file lives, and the atomic write that replaces it.
hyprforge-paths = { git = "https://github.com/adamrpostjr/hyprforge" }

# Used only by the binary. Cargo has no way to say that for a crate with
# both, and splitting into two crates to express it would be more
# ceremony than the fact is worth — hyprforge-displayd carries the same
# arrangement.
hyprforge-network = { git = "https://github.com/adamrpostjr/hyprforge" }
hyprforge-bluetooth = { git = "https://github.com/adamrpostjr/hyprforge" }
# Keep awake (systemd-logind) and night light (hyprsunset via hyprctl) —
# same "binary-only" arrangement as network/bluetooth above.
hyprforge-power = { git = "https://github.com/adamrpostjr/hyprforge" }
hyprforge-ecosystem = { git = "https://github.com/adamrpostjr/hyprforge" }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
tempfile = "3"
hyprforge-network = { git = "https://github.com/adamrpostjr/hyprforge", features = ["mock"] }
hyprforge-bluetooth = { git = "https://github.com/adamrpostjr/hyprforge", features = ["mock"] }
