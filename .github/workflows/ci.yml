# CI for the hyprforge-tray repository. In the Hyprforge monorepo this directory
# is a submodule at `crates/hyprforge-tray`; this file takes effect only here, at
# the repository's root.
#
# What this checks: that the crate builds, that clippy is silent (a
# clippy warning is a build failure in Hyprforge — see the upstream
# CLAUDE.md's "Clippy must be silent" rule), and the tier-1 test suite —
# the tests that need nothing but this process.
#
# What this deliberately does NOT check, and must never claim to:
#   - `tests/live_tray.rs` is `#[ignore]`d: it registers a real
#     `org.kde.StatusNotifierItem` against whatever `StatusNotifierWatcher`
#     is running and asserts the watcher lists it — the visible side
#     effect is an icon appearing in a real bar for a fraction of a
#     second. There is no session bus, no tray watcher and no bar on this
#     runner, so nothing here runs `-- --ignored`, and a plain `cargo
#     test` skipping it is correct, not a pass on that question.
#   - `tests/live_icons.rs` resolves every icon name this daemon can put
#     on the bus against the icon themes actually installed on a real
#     machine. It needs no bus, only files on disk, but a CI runner has
#     no icon theme installed either, so it marks itself skipped
#     (`HYPRFORGE-SKIP:`) rather than silently passing having checked
#     nothing — grep the test output for that marker before trusting a
#     green run on this point.
#   - it never runs `hyprforge-trayd`, and never talks to a real
#     NetworkManager, BlueZ, systemd-logind or hyprsunset. Those belong
#     to `hyprforge-network`, `hyprforge-bluetooth` and
#     `hyprforge-power`'s own live tiers, each gated on the service it
#     actually asks — not on whether a compositor or a bar happens to be
#     running here.
#
# A green run means "the code is internally consistent". It does not
# mean "a real bar shows the icon" or "this daemon has ever touched a
# real radio" — those are exactly the questions the live tests above
# exist to ask, by hand, on a machine that actually has a bar.

name: CI

on:
  push:
  pull_request:

jobs:
  tier-1:
    name: "Tier 1 (no bus, no bar, no radios): build, clippy -D warnings, cargo test"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        # ubuntu-latest ships rustup already; `rustup show` is what
        # makes it notice rust-toolchain.toml in this directory and
        # install exactly the channel and components (clippy, rustfmt)
        # that file pins, rather than whatever `stable` resolves to on
        # the day the job happens to run.
        #
        # System libraries are the next step's business, not this one's.
        run: rustup show

      - name: Cache the cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install native dependencies
        # hyprforge-popup's smithay-client-toolkit links libxkbcommon, and
        # its Wayland client links libwayland — confirmed with `cargo tree
        # -e features -i`, not assumed. The popup came in when the tray's
        # right-click menu moved into the tray crate as a second binary;
        # until this step existed, every run from that commit on failed
        # in smithay-client-toolkit's build script, before any of this
        # repository's code compiled.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libxkbcommon-dev libwayland-dev

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo clippy --all-targets -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: "cargo test (tier 1 only — #[ignore]d live-bus/bar tests do not run)"
        run: cargo test --all-targets
